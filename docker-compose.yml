services:
  backend:
    build:
      context: ./backend
    environment:
      # See .env.example — set these before first run to configure this
      # installation for your own company (admin OTP notice, default first-
      # login password, etc). All other settings (mail, Telegram, WhatsApp,
      # monitored servers...) are configured later from inside the app.
      # Left blank here (the default) means: JWT_SECRET auto-generates and
      # persists in the data volume, DEFAULT_PASSWORD falls back to the
      # backend's built-in default — see backend/services/auth.py.
      - OTP_NOTIFY_EMAIL=${OTP_NOTIFY_EMAIL:-}
      - DEFAULT_PASSWORD=${DEFAULT_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
    volumes:
      - it_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  it_data:
